services:
  backend:
    image: ${DOCKER_USERNAME}/m324_backend:latest
    container_name: todo_backend
    ports:
      - "8080:8080"
    networks:
      - todo_network

  frontend:
    image: ${DOCKER_USERNAME}/m324_frontend:latest
    container_name: todo_frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - todo_network

networks:
  todo_network:
    driver: bridge
